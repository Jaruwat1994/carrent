  <circle cx="580" cy="310" r="38" fill="#252530"/>
  <circle cx="580" cy="310" r="18" fill="#3A3A45"/>
  <line x1="580" y1="272" x2="580" y2="348" stroke="#555" stroke-width="3"/>
  <line x1="542" y1="310" x2="618" y2="310" stroke="#555" stroke-width="3"/>
